spring.profiles.active=${ACTIVE_PROFILE}
server.servlet.context-path=/api
server.error.include-message=always
# Local runs: values for the ${...} placeholders come from the gitignored .env.properties (see .env.properties.example). Skipped when absent (prod uses env vars).
spring.config.import=optional:file:.env.properties
# Trust X-Forwarded-For only from private-range proxies (Render); request.getRemoteAddr() is then the real client IP
server.forward-headers-strategy=native
# Jackson 3 (Boot 4): keep the JSON defaults the frontend was built against under Jackson 2
spring.jackson.use-jackson2-defaults=true
# JDBC batching so saveAll (e.g. new-user defaults) sends batched INSERTs; ids use sequences, so batching applies
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
